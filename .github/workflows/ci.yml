name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Uruchom testy
        run: pytest
    build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zbuduj obraz Dockera
        run: docker build -t pipeline-practice .